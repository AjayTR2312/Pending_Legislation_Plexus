[server]
# Limit per-file upload size to 2MB (matches our total batch limit)
maxUploadSize = 2

# Increase max message size for large file transfers
maxMessageSize = 1000

# Disable CORS and XSRF for compatibility
enableCORS = false
enableXsrfProtection = false

# WebSocket configuration for stable connections
enableWebsocketCompression = false

# File watcher
fileWatcherType = "none"

# Headless mode
headless = true

[browser]
# Disable gather usage stats to prevent external connections
gatherUsageStats = false
serverAddress = "0.0.0.0"

[theme]
base = "light"
