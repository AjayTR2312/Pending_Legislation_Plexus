[pytest]
# Look for tests only under tests/ — keep the main app directory free of
# test discovery so editor refactor tools don't accidentally rename test
# code into production code.
testpaths = tests
# Sensible defaults: short tracebacks, quiet noise, fail fast for
# misconfiguration but not for ordinary failures.
addopts = -ra --strict-markers --tb=short
# Custom markers (none yet, but adding now means new markers will be
# enforced rather than silently accepted).
markers =
    slow: tests that take more than ~1s (skip in normal dev runs)
    pdf: tests that require a PDF fixture under tests/fixtures/
