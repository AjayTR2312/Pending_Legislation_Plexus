<!DOCTYPE html>
<html>
<head>
<script>
// ── Streamlit Bidirectional Component Protocol ──────────────────
function _sendMsg(type, data) {
    window.parent.postMessage(
        Object.assign({isStreamlitMessage: true, type: type}, data || {}),
        "*"
    );
}
function setComponentValue(value) {
    _sendMsg("streamlit:setComponentValue", {value: value});
}
function setReady() {
    _sendMsg("streamlit:componentReady", {apiVersion: 1});
    _sendMsg("streamlit:setFrameHeight", {height: 0});
}

// ── Read edited text from localStorage and send to Streamlit ──
function doSave(){
    var text = null;
    try { text = localStorage.getItem('_pdfCompareEditedText'); } catch(e){}
    if(!text){
        try { text = window.parent._pdfCompareEditedText; } catch(e2){}
    }
    if(text && text.length > 0){
        setComponentValue(text);
        try { localStorage.removeItem('_pdfCompareEditedText'); } catch(e){}
        try { localStorage.removeItem('_pdfCompareSaveTs'); } catch(e){}
    } else {
        setComponentValue('__NO_SAVE__');
    }
}

setReady();
// Small delay to ensure Streamlit is listening before we send the value
setTimeout(doSave, 100);
</script>
</head>
<body style="margin:0;padding:0;overflow:hidden;height:0;"></body>
</html>
